<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="laTuno — ERP para empresas de transporte en México. Viajes, flota, CFDI y Carta Porte. Un producto Boeltech."
    />
    <title>laTuno</title>
  </head>
  <body>
    <!-- Anti-FOUC: keep aligned with src/shared/ui/theme/themeRuntime.ts (THEME_STORAGE_KEY) -->
    <script>
      (function () {
        try {
          var storageKey = "boeltech-theme";
          var mode = localStorage.getItem(storageKey) || "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          if (resolved === "dark" || resolved === "light") {
            document.documentElement.classList.remove("light", "dark");
            document.documentElement.classList.add(resolved);
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
