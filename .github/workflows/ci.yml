name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
          scope: "@boeltech"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:test

      # Fail on ESLint errors; warnings capped at baseline (CEO 2026-10-16 opción 1 / F4b).
      # Historical debt rules downgraded to warn in eslint.config.js; max-warnings=163
      # (= 114 former errors + 49 prior warnings). Do not raise without re-measure;
      # cleanup pedido may restore error severity and lower the cap.
      - name: Lint
        run: npm run lint

      - name: Design token guardrail
        run: npm run lint:design-tokens

      - name: WCAG contrast audit (dark)
        run: npm run audit:contrast

      - name: Unit tests
        run: npm run test

      # Sentry source maps — enabled with deploy-staging.yml / deploy-prod.yml
      # env:
      #   SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

