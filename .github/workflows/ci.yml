name: CI

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
          scope: "@boeltech"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Design token guardrail
        run: npm run lint:design-tokens

      - name: Dark mode smoke tests
        run: npm run test:smoke:dark

      - name: WCAG contrast audit (dark)
        run: npm run audit:contrast

      - name: Unit tests
        run: npm run test

      # Sentry source maps — enabled with deploy-staging.yml / deploy-prod.yml
      # env:
      #   SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

