name: Deploy Production (Web)

on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: "Desplegar sin CI en verde sobre el commit (override CEO, HB-G5)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read
  actions: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: boeltech-web-prod
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
  VITE_API_URL: https://api.boeltech.com/api/v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "El commit $GITHUB_SHA no está en main: producción solo despliega commits de main."
            exit 1
          fi

      - name: Wait for green CI on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url)
            STATUS=$(echo "$RUN" | jq -r '.[0].status // "missing"')
            CONCLUSION=$(echo "$RUN" | jq -r '.[0].conclusion // ""')
            URL=$(echo "$RUN" | jq -r '.[0].url // ""')
            if [ "$STATUS" = "missing" ] && [ "$i" -ge 4 ]; then
              echo "No hay corrida de CI (push) para $GITHUB_SHA."
              exit 1
            fi
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI en verde: $URL"
                exit 0
              fi
              echo "CI terminó en '$CONCLUSION': $URL"
              exit 1
            fi
            echo "CI: $STATUS (intento $i/40)"
            sleep 30
          done
          echo "CI no terminó en 20 min para $GITHUB_SHA."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
          scope: "@boeltech"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_PROD }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY_PROD }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VITE_MAPBOX_PUBLIC_TOKEN_PROD }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_PROD }}
          # Kill-switch tickets Centro de ayuda (GitHub env prod; vacía = on en runtime).
          VITE_HELP_TICKETS_ENABLED: ${{ vars.VITE_HELP_TICKETS_ENABLED }}
          VITE_GEO_PROVIDER: mapbox
          VITE_ENVIRONMENT: production
          VITE_GIT_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: boeltech
          SENTRY_PROJECT: erp-t-web
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "*.map"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Smoke web
        run: |
          for i in $(seq 1 30); do
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -L "https://app.boeltech.com/")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Smoke OK: app.boeltech.com respondió HTTP 200 (intento $i/30)"
              exit 0
            fi
            echo "Smoke: HTTP $HTTP_STATUS (intento $i/30)"
            sleep 10
          done
          echo "Smoke falló: app.boeltech.com no respondió HTTP 200 tras 5 min"
          exit 1
